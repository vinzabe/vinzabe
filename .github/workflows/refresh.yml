name: Refresh profile

on:
  schedule:
    - cron: "23 4 * * *" # daily: cards and the contribution snake
    - cron: "23 10,16,22 * * *" # cards only, so new advisories and CVEs show up within hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - scripts/**
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  cards:
    name: Cards and README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate cards and README
        env:
          # The star list is read through the API or, when it's public, from its
          # page. A private list needs its owner's token in the optional
          # PROFILE_TOKEN secret; without either, config.json is used.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python3 scripts/generate.py

      - name: Commit if anything visible changed
        run: |
          # Exact star counts in data/ drift every day; only commit when the
          # rendered profile (README, cards, header, stats) or config changes...
          if [ -n "$(git status --porcelain -- README.md assets config.json)" ]; then
            msg="chore: refresh profile cards"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            # ...or after 50 quiet days, because GitHub pauses scheduled
            # workflows in repositories with no activity for 60 days.
            msg="chore: refresh contribution data"
          else
            echo "No visible changes."
            exit 0
          fi
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "$msg"
          git push

  snake:
    name: Contribution snake
    # The contribution graph only needs redrawing once a day.
    if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#0969da
            dist/snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Update contribution snake"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
